<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Dashboard</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-t:#fff;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1c1f28;--text:#e8eaf0;--muted:#9aa0ae;--line:#2c303c;--accent:#4f8cff;--accent-t:#0b1020;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.active,.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.api{font-size:12px;color:var(--muted)} .api input{width:200px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
tr.click{cursor:pointer} tr.click:hover{background:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:12px}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;color:var(--muted)}
.pager button:disabled{opacity:.4;cursor:default}
.bar{height:10px;background:var(--line);border-radius:5px;min-width:120px}.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.msg{padding:14px;color:var(--muted)} .err{color:var(--bad)}
.good{color:var(--ok)} .poor{color:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.show{display:flex}
#modal .box{background:var(--card);border-radius:12px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.box h2{margin:0 0 4px;font-size:18px}.close{float:right}
.profile{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin:8px 0 14px}
</style>
</head>
<body>
<header>
  <h1>🎓 School Dashboard</h1>
  <nav id="nav"></nav>
  <div class="api">API: <input id="apiBase" value="http://localhost:3000"></div>
</header>
<main id="app"></main>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script src="script.js"></script>
</body>
</html>
